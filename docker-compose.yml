services:
  web:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./:/usr/share/nginx/html:ro
    networks:
      - web
    labels:
      - traefik.enable=true
      - traefik.http.routers.21dias.rule=Host(`21dias.juliadodigital.com.br`)
      - traefik.http.routers.21dias.entrypoints=websecure
      - traefik.http.routers.21dias.tls.certresolver=letsencrypt
      - traefik.http.services.21dias.loadbalancer.server.port=80

networks:
  web:
    external: true
